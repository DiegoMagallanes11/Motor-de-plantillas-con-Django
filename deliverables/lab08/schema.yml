components:
  schemas:
    Choice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        text:
          type: string
          maxLength: 200
        is_correct:
          type: boolean
      required:
      - id
      - text
    ChoiceResource:
      type: object
      description: Standalone option writes preserve the parent question's invariant.
      properties:
        id:
          type: integer
          readOnly: true
        question:
          type: integer
        text:
          type: string
          maxLength: 200
        is_correct:
          type: boolean
      required:
      - id
      - question
      - text
    Exam:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 120
        created_at:
          type: string
          format: date-time
          readOnly: true
        question_count:
          type: integer
          readOnly: true
      required:
      - created_at
      - id
      - question_count
      - title
    PaginatedChoiceResourceList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceResource'
    PaginatedExamList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Exam'
    PaginatedQuestionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Question'
    PatchedChoiceResource:
      type: object
      description: Standalone option writes preserve the parent question's invariant.
      properties:
        id:
          type: integer
          readOnly: true
        question:
          type: integer
        text:
          type: string
          maxLength: 200
        is_correct:
          type: boolean
    PatchedExam:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 120
        created_at:
          type: string
          format: date-time
          readOnly: true
        question_count:
          type: integer
          readOnly: true
    PatchedQuestion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        exam:
          type: integer
        text:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
        created_at:
          type: string
          format: date-time
          readOnly: true
    Question:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        exam:
          type: integer
        text:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/Choice'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - choices
      - created_at
      - exam
      - id
      - text
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
